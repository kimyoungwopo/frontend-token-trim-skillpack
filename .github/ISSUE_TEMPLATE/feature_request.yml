name: Feature request
description: Suggest a skill, template, docs, or automation improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What frontend agent waste or workflow issue should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Hermes skill
        - Codex template
        - Claude template
        - OpenClaude template
        - docs
        - benchmark
        - install/update automation
        - other
  - type: textarea
    id: verification
    attributes:
      label: How would we verify it?
