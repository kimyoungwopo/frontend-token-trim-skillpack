<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Frontend Token Trim workflow</title>
  <desc id="desc">A visual flow showing Graphify, Ponytail, Headroom, and verified frontend output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34d399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2L10 6L2 10" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="32" fill="url(#bg)"/>
  <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200M120 0V520M240 0V520M360 0V520M480 0V520M600 0V520M720 0V520M840 0V520M960 0V520M1080 0V520" stroke="#1e293b" stroke-width="1" opacity="0.55"/>
  <text x="600" y="66" text-anchor="middle" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="34" font-weight="800">Frontend Token Trim</text>
  <text x="600" y="98" text-anchor="middle" fill="#94a3b8" font-family="Inter, ui-sans-serif, system-ui" font-size="17">Narrow context · minimal diff · verified frontend output</text>

  <path d="M300 255H430" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M580 255H710" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M860 255H990" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="72" y="166" width="228" height="178" rx="22" fill="#0f172a" stroke="#334155"/>
    <circle cx="116" cy="210" r="20" fill="url(#cyan)"/>
    <text x="150" y="216" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="800">Graphify</text>
    <text x="100" y="262" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui" font-size="16">route → component</text>
    <text x="100" y="289" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui" font-size="16">data/style → QA</text>
    <text x="100" y="320" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui" font-size="13">Read only connected files</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="432" y="166" width="228" height="178" rx="22" fill="#0f172a" stroke="#334155"/>
    <circle cx="476" cy="210" r="20" fill="url(#emerald)"/>
    <text x="510" y="216" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="800">Ponytail</text>
    <text x="460" y="262" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Reuse existing code</text>
    <text x="460" y="289" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Smallest correct diff</text>
    <text x="460" y="320" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui" font-size="13">No unneeded abstractions</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="792" y="166" width="228" height="178" rx="22" fill="#0f172a" stroke="#334155"/>
    <circle cx="836" cy="210" r="20" fill="url(#violet)"/>
    <text x="870" y="216" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="24" font-weight="800">Headroom</text>
    <text x="820" y="262" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Compress outputs</text>
    <text x="820" y="289" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui" font-size="16">Save context for QA</text>
    <text x="820" y="320" fill="#64748b" font-family="Inter, ui-sans-serif, system-ui" font-size="13">Evidence over essays</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1000" y="194" width="128" height="122" rx="20" fill="#f8fafc"/>
    <rect x="1020" y="215" width="88" height="18" rx="5" fill="#0f172a"/>
    <rect x="1020" y="247" width="88" height="12" rx="4" fill="#cbd5e1"/>
    <rect x="1020" y="271" width="62" height="12" rx="4" fill="#cbd5e1"/>
    <circle cx="1096" cy="282" r="11" fill="#22c55e"/>
    <path d="M1090 282L1094 286L1102 277" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1064" y="354" text-anchor="middle" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui" font-size="15" font-weight="700">verified result</text>
</svg>
